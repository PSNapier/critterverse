<!doctype html>
<html lang="en" data-theme="breeding">
	<meta charset="UTF-8" />

	<title>Critterverse Rollers</title>
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<link rel="stylesheet" href="src/css/output.css" />

	<body class="h-screen">
		<div class="flex flex-col items-center p-4">
			<h1 class="mb-2 text-2xl font-bold">Critterverse Rollers</h1>
			<div class="flex flex-row gap-2">
				<button
					id="mode-btn-breeding"
					onclick="setMode('breeding')"
					class="btn"
				>
					Breeding
				</button>
				<button
					id="mode-btn-randomizer"
					onclick="setMode('randomizer')"
					class="btn"
				>
					Randomizer
				</button>
			</div>
		</div>

		<div
			id="card"
			class="m-2 mx-auto mb-8 grid h-[325px] max-w-[720px] grid-cols-9 text-lg transition"
		>
			<div id="input" class="col-span-5 text-xl"></div>
			<div id="output" class="col-span-4 flex flex-col gap-2">
				<div id="output-content" class="text-center"></div>
				<button id="roll-btn" class="roll-btn">Roll</button>
			</div>
		</div>

		<footer class="pb-4 text-center text-sm text-white opacity-70">
			<p>Copyright © <span id="copyright-year"></span> Critterverse</p>
			<p>
				Website by
				<a href="mailto:abaturestudio@gmail.com" class="underline"
					>Abature Studio</a
				>
			</p>
		</footer>

		<script>
			document.getElementById('copyright-year').textContent =
				new Date().getFullYear();
		</script>

		<script src="src/js/toolbox.js"></script>
		<script src="src/js/swapMode.js"></script>
		<script src="src/js/dictionaries.js"></script>
		<script src="src/js/breeding/input.js"></script>
		<script src="src/js/breeding/output.js"></script>
		<script src="src/js/randomizer/input.js"></script>
		<script src="src/js/randomizer/output.js"></script>
	</body>
</html>
